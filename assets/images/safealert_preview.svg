  <!-- Chart bars -->
  <rect x="490" y="410" width="28" height="45" rx="3" fill="rgba(88,166,255,0.6)"/>
  <rect x="528" y="395" width="28" height="60" rx="3" fill="rgba(88,166,255,0.6)"/>
  <rect x="566" y="420" width="28" height="35" rx="3" fill="rgba(88,166,255,0.6)"/>
  <rect x="604" y="400" width="28" height="55" rx="3" fill="rgba(248,81,73,0.7)"/>
  <rect x="642" y="415" width="28" height="40" rx="3" fill="rgba(88,166,255,0.6)"/>
  <rect x="680" y="430" width="28" height="25" rx="3" fill="rgba(88,166,255,0.6)"/>
  <rect x="718" y="408" width="28" height="47" rx="3" fill="rgba(88,166,255,0.6)"/>
  
  <!-- Right side stats -->
  <rect x="792" y="132" width="300" height="336" rx="10" fill="#0D1117" stroke="#21262d" stroke-width="1"/>
  <text x="808" y="158" font-family="JetBrains Mono, monospace" font-size="10" fill="#58A6FF">// System Status</text>
  
  <text x="808" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E">Active Devices</text>
  <text x="1072" y="190" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" fill="#58A6FF" font-weight="bold">12</text>
  
  <line x1="808" y1="202" x2="1072" y2="202" stroke="#21262d" stroke-width="1"/>
  
  <text x="808" y="228" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E">Alerts Today</text>
  <text x="1072" y="228" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" fill="#f85149" font-weight="bold">3</text>
  
  <line x1="808" y1="240" x2="1072" y2="240" stroke="#21262d" stroke-width="1"/>
  
  <text x="808" y="266" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E">Response Rate</text>
  <text x="1072" y="266" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" fill="#3fb950" font-weight="bold">98%</text>
  
  <line x1="808" y1="278" x2="1072" y2="278" stroke="#21262d" stroke-width="1"/>
  
  <text x="808" y="310" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E">Avg Response</text>
  <text x="1072" y="310" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" fill="#58A6FF" font-weight="bold">38s</text>
  
  <!-- Bottom title -->
  <text x="600" y="655" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#30363d">SafeAlert — IoT Emergency Response System</text>
</svg>
